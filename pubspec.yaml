name: perkox_flutter_sdk
description: "Perkox Offerwall Flutter SDK for Android & iOS monetization."
version: 2.0.5
homepage: https://github.com/perkoxofficial/perkox-flutter-sdk
repository: https://github.com/perkoxofficial/perkox-flutter-sdk

environment:
  sdk: '>=3.0.0 <4.0.0'
  flutter: '>=3.3.0'

dependencies:
  flutter:
    sdk: flutter
  plugin_platform_interface: ^2.1.8

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  plugin:
    platforms:
      android:
        package: com.perkox.perkox_flutter_sdk
        pluginClass: PerkoxFlutterSdkPlugin
      ios:
        pluginClass: PerkoxFlutterSdkPlugin
